name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image already ships the Android SDK; accept the licenses so Gradle can
      # pull any missing platform/build-tools itself.
      - name: Accept Android SDK licenses
        run: |
          set -e
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "no sdkmanager found, relying on pre-accepted licenses"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # Uses KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repository secrets
      # when they exist, otherwise falls back to a throwaway key so every run still yields an
      # installable APK.
      - name: Set up release keystore
        run: |
          mkdir -p app/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/zerochan.jks
            echo "KEYSTORE_PATH=app/keystore/zerochan.jks" >> "$GITHUB_ENV"
            {
              echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore app/keystore/zerochan.jks \
              -storepass zerochan -keypass zerochan \
              -alias zerochan \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Zerochan, O=Zerochan, C=NA"
            echo "KEYSTORE_PATH=app/keystore/zerochan.jks" >> "$GITHUB_ENV"
            {
              echo "KEYSTORE_PASSWORD=zerochan"
              echo "KEY_ALIAS=zerochan"
              echo "KEY_PASSWORD=zerochan"
            } >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zerochan-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK to the workflow run
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: zerochan-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error