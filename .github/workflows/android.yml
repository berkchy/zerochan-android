name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ROLLING_TAG: rolling

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image already ships the Android SDK; accept the licenses so Gradle can
      # pull any missing platform/build-tools itself.
      - name: Accept Android SDK licenses
        run: |
          set -e
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "no sdkmanager found, relying on pre-accepted licenses"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Build $VERSION_NAME ($VERSION_CODE)"

      # Uses KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD repository secrets
      # when they exist, otherwise falls back to a throwaway key so every run still yields an
      # installable APK.
      - name: Set up release keystore
        run: |
          mkdir -p app/keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/zerochan.jks
            echo "KEYSTORE_PATH=app/keystore/zerochan.jks" >> "$GITHUB_ENV"
            {
              echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore app/keystore/zerochan.jks \
              -storepass zerochan -keypass zerochan \
              -alias zerochan \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Zerochan, O=Zerochan, C=NA"
            echo "KEYSTORE_PATH=app/keystore/zerochan.jks" >> "$GITHUB_ENV"
            {
              echo "KEYSTORE_PASSWORD=zerochan"
              echo "KEY_ALIAS=zerochan"
              echo "KEY_PASSWORD=zerochan"
            } >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/zerochan-${{ steps.version.outputs.name }}.apk
          cp app/build/outputs/apk/debug/*.apk   dist/zerochan-${{ steps.version.outputs.name }}-debug.apk
          ls -lh dist

      # Workflow artifacts are transient: they are pruned 24 hours after the run.
      - name: Upload artifacts (24h retention)
        uses: actions/upload-artifact@v4
        with:
          name: zerochan-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

      # ... while the rolling GitHub Release keeps the latest build around permanently.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION_NAME="${{ steps.version.outputs.name }}"
          VERSION_CODE="${{ steps.version.outputs.code }}"
          SHA="$(git rev-parse --short HEAD)"

          NOTES=$(mktemp)
          cat CHANGELOG.md > "$NOTES"
          {
            echo
            echo "---"
            echo
            echo "### This build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION_NAME\` (versionCode $VERSION_CODE) |"
            echo "| Commit | \`$SHA\` |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Workflow run | [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| Signed | ${{ secrets.KEYSTORE_BASE64 != '' && 'project keystore' || 'ephemeral CI keystore' }} |"
            echo
            echo "Download \`zerochan-$VERSION_NAME.apk\` below. Allow \"install from unknown sources\" once."
          } >> "$NOTES"

          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release upload "$ROLLING_TAG" dist/*.apk --clobber
            gh release edit "$ROLLING_TAG" \
              --title "Zerochan $VERSION_NAME (rolling)" \
              --notes-file "$NOTES"
          else
            gh release create "$ROLLING_TAG" dist/*.apk \
              --title "Zerochan $VERSION_NAME (rolling)" \
              --notes-file "$NOTES" \
              --latest
          fi
